<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" width="960" height="880" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#a8a29a"/>
    </marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#7a7a82"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#1a9970"/>
    </marker>
  </defs>

  <rect width="960" height="880" fill="#ffffff"/>

  <text x="480" y="44" fill="#8a8a8a" font-size="15" font-weight="600"
        text-anchor="middle" letter-spacing="0.12em">PIPELINE DE INGESTÃO</text>

  <!-- ============================== arrows (behind blocks) ============================== -->

  <!-- spine: agenda -> discovery -->
  <line x1="480" y1="136" x2="480" y2="192" stroke="#a8a29a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- spine: discovery -> fetch -->
  <line x1="480" y1="264" x2="480" y2="328" stroke="#a8a29a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- spine: fetch -> normalize (the claim-check hop) -->
  <line x1="480" y1="408" x2="480" y2="472" stroke="#a8a29a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- spine: normalize -> catalogo -->
  <line x1="480" y1="552" x2="480" y2="616" stroke="#a8a29a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- spine: catalogo -> gate -->
  <line x1="480" y1="688" x2="480" y2="752" stroke="#a8a29a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- branch out of the gate -->
  <line x1="624" y1="788" x2="712" y2="788" stroke="#a8a29a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- action / observation pair: fetch <-> fonte -->
  <line x1="360" y1="356" x2="264" y2="356" stroke="#7a7a82" stroke-width="1.25"
        stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>
  <line x1="264" y1="380" x2="360" y2="380" stroke="#7a7a82" stroke-width="1.25"
        stroke-dasharray="5,4" marker-end="url(#arrow-dash)"/>

  <!-- claim-check detour: fetch -> zona raw -> normalize -->
  <path d="M 600 388 C 652 394, 664 428, 696 448" fill="none"
        stroke="#a8a29a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 696 476 C 664 490, 640 498, 600 504" fill="none"
        stroke="#a8a29a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- green feedback: fetch re-enqueues itself while the page comes back full.
       Sweeps through the left margin so it never crosses a block. -->
  <path d="M 360 344 C 268 322, 288 264, 424 328" fill="none"
        stroke="#1a9970" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- ============================== blocks ============================== -->

  <!-- agenda (terminal, neutral) -->
  <rect x="376" y="80" width="208" height="56" rx="28" fill="#ffffff"/>
  <rect x="376" y="80" width="208" height="56" rx="28" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="480" y="104" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">agenda</text>
  <text x="480" y="122" fill="#8a8577" font-size="11" font-weight="500" text-anchor="middle">cron por fonte</text>

  <!-- discovery (compute) -->
  <rect x="360" y="192" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="360" y="192" width="240" height="72" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="480" y="224" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">discovery</text>
  <text x="480" y="242" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">lê o registro de fontes</text>

  <!-- fetch (compute) -->
  <rect x="360" y="328" width="240" height="80" rx="10" fill="#ffffff"/>
  <rect x="360" y="328" width="240" height="80" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="480" y="364" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">fetch</text>
  <text x="480" y="382" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">camada 1 · ETag · breaker</text>

  <!-- fonte de vagas (terminal, neutral — the outside world) -->
  <rect x="64" y="336" width="200" height="64" rx="10" fill="#ffffff"/>
  <rect x="64" y="336" width="200" height="64" rx="10" fill="#f1efe8" stroke="#d8d4c4" stroke-width="1.25"/>
  <text x="164" y="364" fill="#4a4a4a" font-size="15" font-weight="500" text-anchor="middle">fonte de vagas</text>
  <text x="164" y="382" fill="#8a8577" font-size="11" font-weight="500" text-anchor="middle">Gupy · Greenhouse · …</text>

  <!-- zona raw (store) -->
  <rect x="696" y="424" width="200" height="72" rx="10" fill="#ffffff"/>
  <rect x="696" y="424" width="200" height="72" rx="10" fill="#e7f1fb" stroke="#a8c8e8" stroke-width="1.25"/>
  <text x="796" y="456" fill="#2a5580" font-size="15" font-weight="500" text-anchor="middle">zona raw</text>
  <text x="796" y="474" fill="#3a70a8" font-size="11" font-weight="500" text-anchor="middle">S3 · payload bruto</text>

  <!-- normalize (compute) -->
  <rect x="360" y="472" width="240" height="80" rx="10" fill="#ffffff"/>
  <rect x="360" y="472" width="240" height="80" rx="10" fill="#eeedfe" stroke="#b9b5e8" stroke-width="1.25"/>
  <text x="480" y="508" fill="#3a3560" font-size="15" font-weight="500" text-anchor="middle">normalize</text>
  <text x="480" y="526" fill="#6a63b0" font-size="11" font-weight="500" text-anchor="middle">camada 2 · ACL · JobPosting</text>

  <!-- catalogo (store) -->
  <rect x="360" y="616" width="240" height="72" rx="10" fill="#ffffff"/>
  <rect x="360" y="616" width="240" height="72" rx="10" fill="#e7f1fb" stroke="#a8c8e8" stroke-width="1.25"/>
  <text x="480" y="648" fill="#2a5580" font-size="15" font-weight="500" text-anchor="middle">catálogo</text>
  <text x="480" y="666" fill="#3a70a8" font-size="11" font-weight="500" text-anchor="middle">DynamoDB · fonte da verdade</text>

  <!-- gate (evaluation) -->
  <rect x="336" y="752" width="288" height="72" rx="10" fill="#ffffff"/>
  <rect x="336" y="752" width="288" height="72" rx="10" fill="#e1f4ee" stroke="#9dd3c2" stroke-width="1.25"/>
  <text x="480" y="784" fill="#1f6a56" font-size="15" font-weight="500" text-anchor="middle">contentHash mudou?</text>
  <text x="480" y="802" fill="#2f8a72" font-size="11" font-weight="500" text-anchor="middle">~98% não muda entre rodadas</text>

  <!-- indice + alertas (outcome) -->
  <rect x="712" y="756" width="200" height="64" rx="10" fill="#ffffff"/>
  <rect x="712" y="756" width="200" height="64" rx="10" fill="#e7f1fb" stroke="#a8c8e8" stroke-width="1.25"/>
  <text x="812" y="784" fill="#2a5580" font-size="15" font-weight="500" text-anchor="middle">índice + alertas</text>
  <text x="812" y="802" fill="#3a70a8" font-size="11" font-weight="500" text-anchor="middle">fatias 3 e 5</text>

  <!-- ============================== arrow labels ============================== -->

  <rect x="496" y="288" width="180" height="16" fill="#ffffff"/>
  <text x="586" y="300" fill="#8a8a8a" font-size="11" text-anchor="middle">1 tarefa por seletor/página</text>

  <rect x="288" y="338" width="48" height="15" fill="#ffffff"/>
  <text x="312" y="349" fill="#8a8a8a" font-size="11" text-anchor="middle">GET</text>

  <rect x="282" y="384" width="60" height="15" fill="#ffffff"/>
  <text x="312" y="395" fill="#8a8a8a" font-size="11" text-anchor="middle">payload</text>

  <rect x="286" y="432" width="176" height="16" fill="#ffffff"/>
  <text x="374" y="444" fill="#8a8a8a" font-size="11" text-anchor="middle">ponteiro, não o corpo</text>

  <rect x="612" y="402" width="56" height="15" fill="#ffffff"/>
  <text x="640" y="413" fill="#8a8a8a" font-size="11" text-anchor="middle">grava</text>

  <rect x="616" y="506" width="72" height="15" fill="#ffffff"/>
  <text x="652" y="517" fill="#8a8a8a" font-size="11" text-anchor="middle">lê o bruto</text>

  <rect x="644" y="770" width="40" height="15" fill="#ffffff"/>
  <text x="664" y="781" fill="#8a8a8a" font-size="11" text-anchor="middle">sim</text>

  <!-- feedback label, in the curve's own color -->
  <text x="164" y="286" fill="#1a9970" font-size="11" font-weight="600" text-anchor="middle">próxima página</text>
  <text x="164" y="302" fill="#1a9970" font-size="11" font-weight="600" text-anchor="middle">enquanto vier cheia</text>

</svg>
